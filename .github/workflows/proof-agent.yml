name: Proof Agent Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  models: read  # Required for GitHub Models API

jobs:
  verify:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Verify PR with Proof Agent
        uses: AndreaGriffiths11/proof-agent@v1.0.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          models-token: ${{ secrets.GH_MODELS_TOKEN }}
          base-ref: origin/main
          force: true
          block-on-fail: true
          post-comment: true
          comment-mode: collapse
